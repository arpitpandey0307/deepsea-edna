# Retraining pipeline: train -> log to MLflow -> register @challenger -> approval gate -> @champion
#
# Trigger manually (Actions > Model Retraining > Run workflow) or from automation such as a drift
# detector:  POST /repos/{owner}/{repo}/dispatches  {"event_type": "retrain", "client_payload": {"epochs": 20}}
#
# MLflow target: set the repository secret MLFLOW_TRACKING_URI to a tracking server reachable from
# GitHub (the API then picks up a promoted champion via POST /api/model/reload). Without it, the run
# uses a throwaway MLflow store on the runner, seeded with the bundled champion, and uploads it.
#
# GitHub-hosted runners are CPU-only: the default is a quick subsampled run. Full training belongs
# on a GPU (self-hosted) runner: leave max_per_class empty and raise the epochs.
name: Model Retraining

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs"
        default: "3"
      max_per_class:
        description: "Sequences per class (empty = full 48k dataset)"
        default: "300"
      promote:
        description: "Promote to @champion if it beats the current champion"
        type: boolean
        default: true
  repository_dispatch:
    types: [retrain]

permissions:
  contents: read

jobs:
  retrain:
    name: Train, register and gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EPOCHS: ${{ github.event.inputs.epochs || github.event.client_payload.epochs || '3' }}
      MAX_PER_CLASS: ${{ github.event.inputs.max_per_class || github.event.client_payload.max_per_class || '300' }}
      PROMOTE: ${{ github.event.inputs.promote || github.event.client_payload.promote || 'true' }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_EXPERIMENT: marine-edna-classification
      MLFLOW_MODEL_NAME: marine-edna-classifier
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
      GIT_PYTHON_REFRESH: quiet
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/training/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -r backend/training/requirements.txt

      - name: Configure MLflow
        run: |
          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            store="$RUNNER_TEMP/mlflow"
            mkdir -p "$store"
            echo "MLFLOW_TRACKING_URI=sqlite:///$store/mlflow.db" >> "$GITHUB_ENV"
            echo "LOCAL_MLFLOW_STORE=$store" >> "$GITHUB_ENV"
            python -c "import mlflow; mlflow.set_tracking_uri('sqlite:///$store/mlflow.db'); mlflow.create_experiment('$MLFLOW_EXPERIMENT', artifact_location='file://$store/artifacts')"
            echo "Using a throwaway MLflow store on the runner (set secret MLFLOW_TRACKING_URI to use your server)"
          fi

      - name: Ensure a champion baseline exists
        working-directory: backend
        run: python -m app.ml.cli bootstrap

      - name: Train and register @challenger
        working-directory: backend
        run: |
          args="--data_dir ../data/training/marine_diverse --output_dir $RUNNER_TEMP/model --epochs $EPOCHS --device cpu"
          if [ -n "$MAX_PER_CLASS" ]; then args="$args --max_per_class $MAX_PER_CLASS"; fi
          if [ "$PROMOTE" = "true" ]; then args="$args --promote"; fi
          python training/train_model.py $args 2>&1 | tee "$RUNNER_TEMP/training.log"

      - name: Registry summary
        working-directory: backend
        run: |
          {
            echo "## Model registry after retraining"
            echo '```'
            python -m app.ml.cli info
            grep -E "Approval gate|registered .* @challenger" "$RUNNER_TEMP/training.log" | sed -E 's/^.* - INFO - //'
            echo '```'
            echo "Epochs: $EPOCHS · per-class cap: ${MAX_PER_CLASS:-none} · promote: $PROMOTE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload model and reports
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/model/best_model.pth
            ${{ runner.temp }}/model/*.json
            ${{ runner.temp }}/model/*.png
            ${{ runner.temp }}/training.log

      - name: Upload throwaway MLflow store
        if: env.LOCAL_MLFLOW_STORE != ''
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-store-${{ github.run_number }}
          path: ${{ env.LOCAL_MLFLOW_STORE }}
